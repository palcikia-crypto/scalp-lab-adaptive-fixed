name: BT Worker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy requests

      - name: Run worker (queue + waves)
        working-directory: scalp-lab
        run: python worker.py --budget 32

      - name: Run reporter
        working-directory: scalp-lab
        run: python reporter.py || true

      - name: Brain (market regime)
        working-directory: scalp-lab
        run: python brain.py || true

      - name: Paper trading (adaptive + brain)
        working-directory: scalp-lab
        run: timeout 180 python paper.py || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "bt: auto results $(date -u +'%m-%d %H:%M')"
          git push
